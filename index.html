<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KeyLab: teclados mecánicos custom, componentes y un armador paso a paso con validación de compatibilidad." />
    <meta name="theme-color" content="#09090b" />
    <script>
      // Aplica el tema guardado (día / noche / automático) antes de pintar, para evitar un destello
      (function () {
        var theme = 'dark';
        try {
          var pref = localStorage.getItem('keylab.theme');
          var systemLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          theme = pref === 'light' || pref === 'dark' ? pref : systemLight ? 'light' : 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>KeyLab · Teclados mecánicos custom</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
